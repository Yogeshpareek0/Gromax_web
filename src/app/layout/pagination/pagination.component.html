<nav *ngIf="totalPages > 1" class="bg-white py-3 mt-3 rounded-2">
  <div class="d-flex justify-content-between align-items-center px-3 flex-wrap">

    <ul class="pagination mb-2 mb-sm-0">
      <li class="page-item" [class.disabled]="currentPage === 1">
        <button class="page-link" (click)="changePage(currentPage - 1)">
          <i class="fa-solid fa-arrow-left pe-2"></i> Previous
        </button>
      </li>
    </ul>

    <ul class="pagination mb-2 mb-sm-0 gap-2 flex-wrap justify-content-center">
      <li class="page-item" *ngIf="visiblePages[0] > 1">
        <button class="page-link" (click)="changePage(1)">1</button>
      </li>

      <li class="page-item disabled" *ngIf="visiblePages[0] > 2">
        <span class="page-link">...</span>
      </li>

      <li class="page-item"
          *ngFor="let page of visiblePages"
          [class.active]="currentPage === page">
        <button class="page-link" (click)="changePage(page)">
          {{ page }}
        </button>
      </li>

      <li class="page-item disabled" *ngIf="visiblePages[visiblePages.length-1] < totalPages - 1">
        <span class="page-link">...</span>
      </li>

      <li class="page-item" *ngIf="visiblePages[visiblePages.length-1] < totalPages">
        <button class="page-link" (click)="changePage(totalPages)">{{ totalPages }}</button>
      </li>
    </ul>

    <ul class="pagination mb-2 mb-sm-0">
      <li class="page-item" [class.disabled]="currentPage === totalPages">
        <button class="page-link" (click)="changePage(currentPage + 1)">
          Next <i class="fa-solid fa-arrow-right ps-2"></i>
        </button>
      </li>
    </ul>

  </div>
</nav>
